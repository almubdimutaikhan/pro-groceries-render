<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5FE" />
    <script>
      /* Apply the saved or device theme before first paint (same rule as src/lib/theme.ts). */
      (function () {
        var t = null;
        try { t = localStorage.getItem('pg-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Pro Groceries · Same basket. Lower price.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
